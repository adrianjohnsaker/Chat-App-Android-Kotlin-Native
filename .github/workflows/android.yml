name: Build AI Girlfriend APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 11 (for Kotlin/Android builds)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Set up Python 3.x
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Backend API or Python Modules (if applicable)
      run: |
        # Add your backend build commands here, for example:
        python setup.py build

    - name: Build Android APK (if applicable)
      working-directory: ./android-app
      run: |
        ./gradlew assembleRelease

    - name: Archive APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: AI-Girlfriend-APK
        path: ./android-app/app/build/outputs/apk/release/app-release.apk

    - name: Archive Backend Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: AI-Girlfriend-Backend
        path: ./build
